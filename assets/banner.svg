<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="slight-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
      transform-origin: 960px 180px;
    }
    .orbit-dot-1 {
      animation: rotate-cw 12s linear infinite;
      transform-origin: 960px 180px;
    }
    .orbit-dot-2 {
      animation: rotate-ccw 16s linear infinite;
      transform-origin: 960px 180px;
    }
    .signal-wave {
      animation: signal 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      transform-origin: 960px 180px;
    }
    .wave-delay-1 { animation-delay: 1s; }
    .wave-delay-2 { animation-delay: 2s; }
    .badge-pill {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.4; }
      100% { transform: scale(1.04); opacity: 0.8; }
    }
    @keyframes rotate-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotate-ccw {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes signal {
      0% { r: 50px; opacity: 0.8; }
      100% { r: 160px; opacity: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Tech Grid -->
  <g class="bg-grid">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200" />
    <path d="M120,0 V360 M240,0 V360 M360,0 V360 M480,0 V360 M600,0 V360 M720,0 V360 M840,0 V360 M960,0 V360 M1080,0 V360" />
  </g>

  <!-- Decorative Circuit Ambient Glow -->
  <circle cx="960" cy="180" r="140" fill="#4facfe" opacity="0.1" filter="url(#glow)"/>
  <circle cx="200" cy="80" r="120" fill="#7000ff" opacity="0.08" filter="url(#glow)"/>

  <!-- Dynamic / Animated Waves & Nodes in Background of Right Side -->
  <g opacity="0.7">
    <circle class="signal-wave" cx="960" cy="180" r="60" stroke="#00f2fe" stroke-width="1.5" fill="none" />
    <circle class="signal-wave wave-delay-1" cx="960" cy="180" r="60" stroke="#4facfe" stroke-width="1.5" fill="none" />
    <circle class="signal-wave wave-delay-2" cx="960" cy="180" r="60" stroke="#7000ff" stroke-width="1.5" fill="none" />

    <!-- Static radar rings -->
    <circle cx="960" cy="180" r="70" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="4 4" fill="none" />
    <circle cx="960" cy="180" r="110" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" fill="none" />
    <circle cx="960" cy="180" r="150" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="6 6" fill="none" />

    <!-- Orbiting nodes -->
    <g class="orbit-dot-1">
      <circle cx="890" cy="180" r="6" fill="#00f2fe" filter="url(#slight-glow)"/>
      <circle cx="1030" cy="180" r="4" fill="#4facfe" />
    </g>
    <g class="orbit-dot-2">
      <circle cx="960" cy="70" r="5" fill="#7000ff" filter="url(#slight-glow)"/>
      <circle cx="960" cy="290" r="4" fill="#00f2fe" />
    </g>

    <!-- Central Cloud & Shield Lock Icon -->
    <g transform="translate(915, 135)">
      <!-- Cloud Outline -->
      <path d="M70,55 A24,24 0 0,0 66,10 A34,34 0 0,0 5,26 A26,26 0 0,0 12,77 L70,77 A20,20 0 0,0 70,55 Z" fill="rgba(15, 23, 42, 0.85)" stroke="#00f2fe" stroke-width="2.5" filter="url(#slight-glow)"/>
      <!-- Shield Center -->
      <path d="M45,36 L57,42 V54 C57,62 52,69 45,72 C38,69 33,62 33,54 V42 Z" fill="url(#shield-grad)" stroke="#4facfe" stroke-width="1.5"/>
      <path d="M42,52 L45,55 L50,49" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Foreground Content: Header Tag, Title, Subtitle, Highlights -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 62)" class="badge-pill">
      <rect width="330" height="30" rx="15" fill="rgba(79, 172, 254, 0.12)" stroke="rgba(79, 172, 254, 0.4)" stroke-width="1"/>
      <circle cx="18" cy="15" r="4.5" fill="#00f2fe" filter="url(#slight-glow)"/>
      <text x="32" y="20" fill="#00f2fe" class="tag-text">CLOUD BACKUP POSTURE MANAGEMENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" font-size="46" fill="#ffffff">
      Awesome Cloud Backup
    </text>
    <text x="0" y="198" class="title-text" font-size="46" fill="url(#primary-glow)">
      Posture Management
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="242" class="sub-text" font-size="17" fill="#94a3b8" letter-spacing="0.2">
      Curated ecosystem of SaaS leaders &amp; open-source projects for continuous backup
    </text>
    <text x="0" y="268" class="sub-text" font-size="17" fill="#94a3b8" letter-spacing="0.2">
      coverage discovery, automated policy audit, immutability &amp; ransomware recovery.
    </text>

    <!-- Feature Attribute Micro-Badges -->
    <g transform="translate(0, 298)">
      <rect x="0" y="0" width="160" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="12" y="17" fill="#cbd5e1" class="tag-text" font-size="11.5">⚡ Continuous Audit</text>

      <rect x="172" y="0" width="168" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="184" y="17" fill="#cbd5e1" class="tag-text" font-size="11.5">🛡️ Ransomware Safe</text>

      <rect x="352" y="0" width="168" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="364" y="17" fill="#cbd5e1" class="tag-text" font-size="11.5">🔍 Recovery Testing</text>
    </g>
  </g>
</svg>
